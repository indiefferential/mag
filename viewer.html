<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flipbook Viewer</title>

<!-- ============================================================
     This page shows ONE issue. Which issue it shows is picked by
     a URL parameter — that's the "link" you embed per issue:

       viewer.html?book=wnjuly5

     "wnjuly5" must match a "slug" entry in books.json.
     See README.md for the full workflow to add a new issue.
     ============================================================ -->

<style>
  :root{
    --ink:#161311;
    --paper:#ece5d6;
    --gold:#b08d4f;
    --gold-bright:#d4af6a;
    --line:rgba(212,175,106,0.18);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--ink);
    overflow:hidden;
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    -webkit-user-select:none; user-select:none;
  }
  #stage{
    position:relative;
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, #262019 0%, #161311 62%, #0b0a08 100%);
  }
  #stage::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    pointer-events:none; opacity:0.5;
  }
  #topBar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    z-index:6;
    pointer-events:none;
  }
  #topBar a, #topBar span{ pointer-events:auto; }
  #homeLink{
    display:flex; align-items:center; gap:6px;
    color:#cabf9f; text-decoration:none;
    font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    opacity:0.7; transition:opacity .15s ease;
  }
  #homeLink:hover{ opacity:1; }
  #homeLink svg{ width:14px; height:14px; }
  #bookTitle{
    color:#cabf9f; font-size:13px; letter-spacing:0.06em; opacity:0.75;
  }
  #bookWrap{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    width:100%; flex:1 1 auto; min-height:0;
    padding:56px 92px 24px;
  }
  #book{ box-shadow:0 30px 60px -15px rgba(0,0,0,0.7), 0 10px 25px -5px rgba(0,0,0,0.5); }
  .pf-page{ background:var(--paper); width:100%; height:100%; overflow:hidden; position:relative; }
  .pf-page img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; -webkit-user-drag:none; }
  .pf-page .pf-num{ position:absolute; bottom:10px; font-size:11px; letter-spacing:0.08em; color:#7a6f5c; font-family:Georgia, serif; }
  .pf-page.pf-left .pf-num{ left:16px; }
  .pf-page.pf-right .pf-num{ right:16px; }
  .pf-page.pf-cover{ background:linear-gradient(160deg,#221c15,#171310); }
  .navBtn{
    position:absolute; top:50%; transform:translateY(-50%);
    width:52px; height:52px; border-radius:50%;
    border:1px solid var(--line);
    background:rgba(20,17,14,0.55); backdrop-filter:blur(6px);
    color:var(--gold-bright);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .2s ease, transform .2s ease, border-color .2s ease;
    z-index:5;
  }
  .navBtn:hover{ background:rgba(212,175,106,0.14); border-color:var(--gold-bright); }
  .navBtn:active{ transform:translateY(-50%) scale(0.94); }
  .navBtn.disabled{ opacity:0.25; pointer-events:none; }
  #prevBtn{ left:24px; }
  #nextBtn{ right:24px; }
  .navBtn svg{ width:20px; height:20px; }
  #bar{
    flex:0 0 auto; width:100%;
    display:flex; align-items:center; justify-content:center; gap:18px;
    padding:12px 20px 18px; color:var(--gold-bright);
  }
  #bar .divider{ width:1px; height:18px; background:var(--line); }
  .iconBtn{
    background:none; border:none; cursor:pointer; color:#cabf9f;
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:8px;
    transition:color .15s ease, background .15s ease;
  }
  .iconBtn:hover{ color:var(--gold-bright); background:rgba(212,175,106,0.1); }
  .iconBtn svg{ width:18px; height:18px; }
  #pageIndicator{ font-size:13px; letter-spacing:0.05em; color:#cabf9f; min-width:82px; text-align:center; font-variant-numeric:tabular-nums; }
  #rail{ position:relative; width:220px; height:3px; background:rgba(212,175,106,0.15); border-radius:2px; overflow:hidden; cursor:pointer; }
  #railFill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg, var(--gold), var(--gold-bright)); transition:width .35s cubic-bezier(.4,0,.2,1); }
  #loader{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:#8a7d61; z-index:20;
    background:radial-gradient(ellipse at 50% 40%, #221c15 0%, #161311 70%);
    transition:opacity .5s ease;
  }
  #loader .ring{ width:34px; height:34px; border-radius:50%; border:2px solid rgba(212,175,106,0.2); border-top-color:var(--gold-bright); animation:spin 0.9s linear infinite; }
  #loader span{ font-size:12px; letter-spacing:0.15em; text-transform:uppercase; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #errorBox{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:#cabf9f; text-align:center; padding:20px; z-index:25;
    background:radial-gradient(ellipse at 50% 40%, #221c15 0%, #161311 70%);
  }
  #errorBox h2{ font-weight:normal; color:var(--gold-bright); margin:0; font-size:18px; }
  #errorBox p{ margin:0; font-size:13px; opacity:0.8; max-width:420px; line-height:1.5; }
  #errorBox code{ background:rgba(212,175,106,0.12); padding:2px 6px; border-radius:4px; }
  button:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }
  #stage:fullscreen{ background:var(--ink); }
  @media (max-width: 720px){
    #bookWrap{ padding:44px 8px 8px; }
    #prevBtn{ left:6px; width:40px; height:40px; }
    #nextBtn{ right:6px; width:40px; height:40px; }
    #bar{ gap:10px; }
    #rail{ width:110px; }
    #pageIndicator{ min-width:60px; font-size:12px; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="topBar">
    <a id="homeLink" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      Library
    </a>
    <span id="bookTitle"></span>
  </div>

  <div id="loader">
    <div class="ring"></div>
    <span>Opening book…</span>
  </div>

  <div id="errorBox">
    <h2>Couldn't find that issue</h2>
    <p id="errorMsg"></p>
  </div>

  <div id="bookWrap">
    <button id="prevBtn" class="navBtn" aria-label="Previous page" title="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div id="book"></div>
    <button id="nextBtn" class="navBtn" aria-label="Next page" title="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>

  <div id="bar">
    <button id="firstBtn" class="iconBtn" aria-label="First page" title="First page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"></polyline><polyline points="18 17 13 12 18 7"></polyline></svg>
    </button>
    <span id="pageIndicator">1 / 1</span>
    <div id="rail"><div id="railFill"></div></div>
    <button id="lastBtn" class="iconBtn" aria-label="Last page" title="Last page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline></svg>
    </button>
    <div class="divider"></div>
    <button id="fsBtn" class="iconBtn" aria-label="Toggle fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"></path></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(async function(){

  function pad(n){ return String(n).padStart(2,'0'); }
  function showError(msg){
    document.getElementById('loader').style.display = 'none';
    document.getElementById('errorMsg').textContent = msg;
    document.getElementById('errorBox').style.display = 'flex';
  }

  // ---- 1. Work out which book to load ----
  const params = new URLSearchParams(location.search);
  const slug = params.get('book');

  let TOTAL_PAGES, PAGE_EXT, PAGE_FOLDER, BOOK_TITLE;

  try {
    if (params.get('folder')) {
      // Ad-hoc mode: viewer.html?folder=books/wnjuly5/pages&pages=34&ext=jpg&title=WN%20July%205
      PAGE_FOLDER = params.get('folder');
      TOTAL_PAGES = parseInt(params.get('pages') || '34', 10);
      PAGE_EXT = params.get('ext') || 'jpg';
      BOOK_TITLE = params.get('title') || '';
    } else {
      // Manifest mode: viewer.html?book=wnjuly5  (looked up in books.json)
      const res = await fetch('books.json');
      if (!res.ok) throw new Error('books.json not found');
      const books = await res.json();

      let entry = null;
      if (slug) {
        entry = books.find(b => b.slug === slug);
        if (!entry) {
          showError(`No book with slug "${slug}" in books.json. Add an entry for it, or check the spelling in your link.`);
          return;
        }
      } else {
        entry = books[0];
        if (!entry) { showError('books.json is empty — add at least one book entry.'); return; }
      }

      PAGE_FOLDER = entry.folder;
      TOTAL_PAGES = entry.totalPages;
      PAGE_EXT = entry.ext;
      BOOK_TITLE = entry.title || '';
    }
  } catch (err) {
    showError('Could not load books.json. If you\'re testing locally by double-clicking the file, run a local server instead (see README) — browsers block file: fetches.');
    return;
  }

  document.getElementById('bookTitle').textContent = BOOK_TITLE;
  document.title = BOOK_TITLE ? `${BOOK_TITLE} — Flipbook` : 'Flipbook Viewer';

  function pageSrc(n){ return `${PAGE_FOLDER}/page-${pad(n)}.${PAGE_EXT}`; }

  // ---- 2. Build the book ----
  const bookEl = document.getElementById('book');
  const pageEls = [];
  for (let i = 1; i <= TOTAL_PAGES; i++){
    const div = document.createElement('div');
    const isCover = (i === 1 || i === TOTAL_PAGES);
    div.className = 'pf-page' + (isCover ? ' pf-cover' : (i % 2 === 0 ? ' pf-left' : ' pf-right'));
    div.setAttribute('data-density', isCover ? 'hard' : 'soft');

    const img = document.createElement('img');
    img.src = pageSrc(i);
    img.draggable = false;
    img.alt = `Page ${i}`;
    div.appendChild(img);

    if (!isCover){
      const num = document.createElement('div');
      num.className = 'pf-num';
      num.textContent = i;
      div.appendChild(num);
    }

    bookEl.appendChild(div);
    pageEls.push(div);
  }

  const SINGLE_W = 560, SINGLE_H = 760;

  const pageFlip = new St.PageFlip(bookEl, {
    width: SINGLE_W,
    height: SINGLE_H,
    size: 'stretch',
    minWidth: 280,
    maxWidth: 1100,
    minHeight: 400,
    maxHeight: 1500,
    maxShadowOpacity: 0.55,
    showCover: true,
    mobileScrollSupport: false,
    usePortrait: true,
    flippingTime: 700,
    drawShadow: true,
  });

  pageFlip.loadFromHTML(pageEls);

  // ---- 3. UI wiring ----
  const loader = document.getElementById('loader');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const firstBtn = document.getElementById('firstBtn');
  const lastBtn = document.getElementById('lastBtn');
  const fsBtn = document.getElementById('fsBtn');
  const indicator = document.getElementById('pageIndicator');
  const rail = document.getElementById('rail');
  const railFill = document.getElementById('railFill');
  const stage = document.getElementById('stage');

  function updateUI(){
    const cur = pageFlip.getCurrentPageIndex();
    const total = pageFlip.getPageCount();
    indicator.textContent = `${cur + 1} / ${total}`;
    railFill.style.width = `${((cur + 1) / total) * 100}%`;
    prevBtn.classList.toggle('disabled', cur <= 0);
    nextBtn.classList.toggle('disabled', cur >= total - 1);
  }

  pageFlip.on('init', () => {
    updateUI();
    loader.style.opacity = '0';
    setTimeout(() => { loader.style.display = 'none'; }, 500);
  });
  pageFlip.on('flip', updateUI);

  prevBtn.addEventListener('click', () => pageFlip.flipPrev());
  nextBtn.addEventListener('click', () => pageFlip.flipNext());
  firstBtn.addEventListener('click', () => pageFlip.flip(0));
  lastBtn.addEventListener('click', () => pageFlip.flip(pageFlip.getPageCount() - 1));

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') pageFlip.flipNext();
    if (e.key === 'ArrowLeft') pageFlip.flipPrev();
  });

  rail.addEventListener('click', (e) => {
    const rect = rail.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    const target = Math.round(ratio * (pageFlip.getPageCount() - 1));
    pageFlip.flip(target);
  });

  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement){
      stage.requestFullscreen?.() || stage.webkitRequestFullscreen?.();
    } else {
      document.exitFullscreen?.() || document.webkitExitFullscreen?.();
    }
  });

  bookEl.addEventListener('contextmenu', (e) => e.preventDefault());
  bookEl.addEventListener('dragstart', (e) => e.preventDefault());

})();
</script>
</body>
</html>
