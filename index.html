<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Library</title>
<style>
  :root{
    --ink:#161311;
    --paper:#ece5d6;
    --gold:#b08d4f;
    --gold-bright:#d4af6a;
    --line:rgba(212,175,106,0.18);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; min-height:100%;
    background:radial-gradient(ellipse at 50% 0%, #221c15 0%, #161311 55%, #0b0a08 100%);
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    color:#cabf9f;
  }
  header{
    padding:48px 24px 20px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-weight:normal;
    font-size:28px;
    letter-spacing:0.03em;
    color:var(--gold-bright);
  }
  header p{
    margin:0; font-size:13px; opacity:0.65; letter-spacing:0.04em;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
    gap:28px;
    max-width:1100px;
    margin:0 auto;
    padding:20px 32px 64px;
  }
  .card{
    display:block;
    text-decoration:none;
    color:inherit;
    cursor:pointer;
    transition:transform .2s ease;
  }
  .card:hover{ transform:translateY(-4px); }
  .cover{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    background:var(--paper);
    border-radius:3px;
    overflow:hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 14px 30px -10px rgba(0,0,0,0.65);
    border:1px solid var(--line);
  }
  .cover img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .cover .spine{
    position:absolute; left:0; top:0; bottom:0; width:10px;
    background:linear-gradient(90deg, rgba(0,0,0,0.35), transparent);
  }
  .card .meta{ padding:12px 2px 0; }
  .card .title{
    font-size:14px; color:#e8ddc4; letter-spacing:0.02em;
  }
  .card .pages{
    font-size:11px; color:#8a7d61; margin-top:2px; letter-spacing:0.05em;
  }
  #empty, #err{
    text-align:center; padding:60px 20px; opacity:0.7; font-size:14px; display:none;
  }
  code{ background:rgba(212,175,106,0.12); padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>

<header>
  <h1>Issue Library</h1>
  <p>Pick an issue to open it as a flipbook</p>
</header>

<div id="grid"></div>
<div id="empty">No issues yet — add one to <code>books.json</code>.</div>
<div id="err">Could not load <code>books.json</code>. If you're testing locally by double-clicking this file, run a local server instead (see README) — browsers block local file fetches.</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script>
(async function(){
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js";
  }

  const grid = document.getElementById('grid');

  async function pdfFirstPageThumb(file, imgEl){
    try {
      const pdf = await pdfjsLib.getDocument(file).promise;
      const page = await pdf.getPage(1);
      const base = page.getViewport({ scale: 1 });
      const scale = 400 / base.width;
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      imgEl.replaceWith(canvas);
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.display = 'block';
    } catch (err) {
      // leave placeholder as-is if rendering fails
    }
  }

  try {
    const res = await fetch('books.json');
    if (!res.ok) throw new Error('missing');
    const books = await res.json();

    if (!books.length){
      document.getElementById('empty').style.display = 'block';
      return;
    }

    books.forEach(b => {
      const isPdf = b.type === 'pdf';
      const a = document.createElement('a');
      a.className = 'card';
      a.href = `viewer.html?book=${encodeURIComponent(b.slug)}`;

      const pagesLabel = isPdf ? 'PDF' : `${b.totalPages} pages`;

      a.innerHTML = `
        <div class="cover">
          <div class="spine"></div>
          <img alt="${b.title} cover" loading="lazy">
        </div>
        <div class="meta">
          <div class="title">${b.title}</div>
          <div class="pages">${pagesLabel}</div>
        </div>
      `;
      const imgEl = a.querySelector('img');

      if (isPdf && b.cover) {
        imgEl.src = b.cover;
      } else if (isPdf) {
        pdfFirstPageThumb(b.file, imgEl);
      } else {
        imgEl.src = b.cover;
      }

      grid.appendChild(a);
    });
  } catch (err) {
    document.getElementById('err').style.display = 'block';
  }
})();
</script>
</body>
</html>
